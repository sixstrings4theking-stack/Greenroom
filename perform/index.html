/* ---------------------------------------------------------------------------
   Perform pipeline. performRenderSong is ChartBench's setListRenderSong
   verbatim in logic: canonical-NN songs need nothing (the renderer converts
   per display key at draw time); legacy letter-key songs get their content
   converted/transposed the same two ways the editor uses.
--------------------------------------------------------------------------- */
function performRenderSong(stored, key, capo){
  key = key || 'NN';
  let content = stored.content || '';
  if(stored.key && stored.key !== 'NN'){
    const storedRoot = (stored.key || 'C').replace(/m$/, '');
    if(key === 'NN'){
      content = NashvilleSystem.contentToNumbers(content, storedRoot);
    } else if(key !== stored.key){
      const from = Transposer.noteIndex(storedRoot);
      const to = Transposer.noteIndex(key.replace(/m$/, ''));
      if(from !== undefined && to !== undefined){
        content = Transposer.transposeText(content, ((to - from) % 12 + 12) % 12, Transposer.FLAT_KEYS.has(key));
      }
    }
  }
  return Object.assign({}, stored, { key, capo: capo || '', content });
}

const KEY_OPTIONS = ['NN','C','C#','Db','D','Eb','E','F','F#','Gb','G','Ab','A','Bb','B'];
const DEFAULT_SCALE = 135;
const SCALE_MIN = 70, SCALE_MAX = 260, SCALE_STEP = 10;
const STAGE_PAD_X = 18, STAGE_PAD_Y = 14;
const POS_KEY = 'cbp_pos_v1';
const RESUME_WINDOW_MS = 6 * 3600 * 1000;

function stageMetrics(){
  const vw = window.innerWidth;
  const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  return { contentW: vw - STAGE_PAD_X * 2, pageH: vh - STAGE_PAD_Y * 2 };
}
function bodyAlignClass(song){
  return song.bodyAlign === 'center' ? ' cs-body-center' : (song.bodyAlign === 'right' ? ' cs-body-right' : '');
}
function stageHeaderHtml(song, sectionsHtmlRoadmap){
  const metaBits = [];
  if(song.key) metaBits.push('Key: ' + song.key);
  if(song.capo) metaBits.push('Capo: ' + song.capo);
  if(song.artist) metaBits.push(song.artist);
  return `<div class="stage-header">
    <div class="cs-title">${Renderer.escapeHtml(song.title || 'Untitled')}</div>
    ${sectionsHtmlRoadmap ? `<div class="cs-roadmap">${sectionsHtmlRoadmap}</div>` : ''}
    ${metaBits.length ? `<div class="cs-meta">${metaBits.map(Renderer.escapeHtml).join(' &nbsp;•&nbsp; ')}</div>` : ''}
  </div>`;
}
function stageContHeaderHtml(song){
  return `<div class="stage-cont-header">${Renderer.escapeHtml(song.title || 'Untitled')} (cont’d)</div>`;
}

// One song -> screen-sized page HTML chunks, using the same offscreen
// measure-then-paginate pattern as ChartBench's buildPrintPagesFor, with
// the viewport standing in for the sheet of paper.
function buildStagePages(song, scalePct){
  const { contentW, pageH } = stageMetrics();
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-9999px;top:0;';
  host.style.width = contentW + 'px';
  host.style.setProperty('--chart-font-scale', scalePct / 100);
  document.body.appendChild(host);
  const sheet = document.createElement('div');
  host.appendChild(sheet);
  const sections = Renderer.renderChordSheet(sheet, song, {});
  const roadmap = Renderer.buildRoadmap(sections);
  const headerHtml = stageHeaderHtml(song, roadmap);
  const probe = document.createElement('div');
  probe.innerHTML = headerHtml;
  host.appendChild(probe);
  const headerPx = probe.getBoundingClientRect().height;
  probe.remove();
  const contProbe = document.createElement('div');
  contProbe.className = 'stage-cont-header';
  contProbe.textContent = 'X (cont’d)';
  host.appendChild(contProbe);
  const contPx = contProbe.getBoundingClientRect().height + 10;
  contProbe.remove();
  const units = Paginator.paginate(sheet, pageH, { contHeaderPx: contPx, headerHeightPx: headerPx });
  document.body.removeChild(host);
  return units.map((sectionHtmls, i) =>
    (i === 0 ? headerHtml : stageContHeaderHtml(song)) + sectionHtmls.join(''));
}

   Performance state + navigation
--------------------------------------------------------------------------- */
const perf = {
  active: false,
  sid: null,          // position-recovery identity: 'set:<id>' or 'song:<uid>'
  setName: '',
  entries: [],        // [{uid, key, capo, arrangementId}] — key/capo mutable via HUD (session-only)
  idx: 0, page: 0,
  cache: {},          // idx -> {pages, scalePct}
};
let wakeLock = null, hudTimer = null, clockTimer = null;

function entryStoredSong(entry){
  const s = songs.find(x => x.uid === entry.uid);
  return s ? songWithArrangement(s, entry.arrangementId) : null;
}
function entryScale(entry){
  return scales[entry.uid] || DEFAULT_SCALE;
}
async function setEntryScale(entry, pct){
  scales[entry.uid] = pct;
  await saveScales();
}
function entryPages(i){
  const c = perf.cache[i];
  if(c) return c;
  const entry = perf.entries[i];
  const stored = entryStoredSong(entry);
  if(!stored) return { pages: ['<div class="stage-cont-header">Missing song</div>'], scalePct: DEFAULT_SCALE, song: null };
  const scalePct = entryScale(entry);
  const song = performRenderSong(stored, entry.key, entry.capo);
  const pages = buildStagePages(song, scalePct);
  const built = { pages, scalePct, song };
  perf.cache[i] = built;
  return built;
}

function renderStage(){
  const built = entryPages(perf.idx);
  perf.page = Math.max(0, Math.min(perf.page, built.pages.length - 1));
  const pageEl = el('stagePage');
  pageEl.className = built.song ? bodyAlignClass(built.song).trim() : '';
  pageEl.style.setProperty('--chart-font-scale', built.scalePct / 100);
  pageEl.innerHTML = built.pages[perf.page];
  updateHud(built);
  savePosition();
}
function updateHud(built){
  built = built || entryPages(perf.idx);
  const entry = perf.entries[perf.idx];
  const title = built.song ? (built.song.title || 'Untitled') : 'Missing song';
  const keyBit = entry.key && entry.key !== 'NN' ? entry.key + (entry.capo ? ' · capo ' + entry.capo : '') : 'NN';
  el('hudTitle').innerHTML = `${Renderer.escapeHtml(title)}<small>${Renderer.escapeHtml(keyBit)}</small>`;
  el('hudPos').textContent = `${perf.idx + 1}/${perf.entries.length} · p ${perf.page + 1}/${built.pages.length}`;
  el('hudKey').value = entry.key || 'NN';
  el('hudCapo').value = entry.capo || '';
  const next = perf.entries[perf.idx + 1];
  if(next){
    const ns = entryStoredSong(next);
    el('hudNext').innerHTML = ns ? `Next: <b>${Renderer.escapeHtml(ns.title || 'Untitled')}</b>${next.key && next.key !== 'NN' ? ' (' + Renderer.escapeHtml(next.key) + ')' : ''}` : '';
  } else {
    el('hudNext').textContent = 'Last song';
  }
  el('hudClock').textContent = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
}

let flashTimer = null;
function flash(title, sub, ms = 1100){
  const f = el('flash');
  f.querySelector('.f-title').textContent = title;
  f.querySelector('.f-sub').textContent = sub || '';
  f.classList.add('show');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => f.classList.remove('show'), ms);
}
function flashEntry(i){
  const entry = perf.entries[i];
  const s = entryStoredSong(entry);
  if(!s) return;
  const keyBit = entry.key && entry.key !== 'NN' ? 'Key of ' + entry.key + (entry.capo ? ' · capo ' + entry.capo : '') : 'Nashville Numbers';
  flash(s.title || 'Untitled', keyBit);
}

function goNext(){
  const built = entryPages(perf.idx);
  if(perf.page < built.pages.length - 1){ perf.page++; renderStage(); return; }
  if(perf.idx < perf.entries.length - 1){
    perf.idx++; perf.page = 0; flashEntry(perf.idx); renderStage(); return;
  }
  flash('End of set', '', 800);
}
function goPrev(){
  if(perf.page > 0){ perf.page--; renderStage(); return; }
  if(perf.idx > 0){
    perf.idx--;
    perf.page = entryPages(perf.idx).pages.length - 1;
    flashEntry(perf.idx); renderStage(); return;
  }
  flash('Top of set', '', 800);
}
function jumpTo(i){
  perf.idx = i; perf.page = 0;
  closeDrawer(); flashEntry(i); renderStage();
}

function savePosition(){
  try{ localStorage.setItem(POS_KEY, JSON.stringify({sid: perf.sid, idx: perf.idx, page: perf.page, ts: Date.now()})); }catch(e){}
}
function restorePosition(sid){
  try{
    const p = JSON.parse(localStorage.getItem(POS_KEY));
    if(p && p.sid === sid && Date.now() - p.ts < RESUME_WINDOW_MS) return p;
  }catch(e){}
  return null;
}

/* ---------------------------------------------------------------------------
   Enter / exit
--------------------------------------------------------------------------- */
function performSet(set){
  let missing = 0, pdfs = 0;
  const entries = [];
  for(const e of set.entries || []){
    if(e.type === 'pdf'){ pdfs++; continue; }
    const s = songs.find(x => x.uid === e.uid) || (e.songId != null ? songs.find(x => x.id === e.songId) : null);
    if(!s){ missing++; continue; }
    entries.push({ uid: s.uid, key: e.key || 'NN', capo: e.capo || '', arrangementId: e.arrangementId });
  }
  if(!entries.length){ toast('None of this set’s songs are in ChartBenchLive’s library — import your library backup first'); return; }
  const notes = [];
  if(missing) notes.push(`${missing} song${missing === 1 ? '' : 's'} not in the library`);
  if(pdfs) notes.push(`${pdfs} attached PDF${pdfs === 1 ? '' : 's'} (not supported yet)`);
  if(notes.length) toast('Skipped: ' + notes.join(' · '));
  enterPerform(entries, set.name, 'set:' + set.id);
}
function performSingle(song){
  enterPerform(
    [{ uid: song.uid, key: song.key || 'NN', capo: song.capo || '', arrangementId: song.activeArrangementId }],
    song.title || 'Untitled', 'song:' + song.uid);
}
function enterPerform(entries, name, sid){
  perf.active = true; perf.sid = sid; perf.setName = name;
  perf.entries = entries.map(e => Object.assign({}, e));
  perf.cache = {};
  perf.idx = 0; perf.page = 0;
  const saved = restorePosition(sid);
  if(saved && saved.idx < entries.length){
    perf.idx = saved.idx; perf.page = saved.page || 0;
    if(perf.idx > 0 || perf.page > 0) toast('Resumed where you left off');
  }
  el('home').classList.add('hidden');
  el('stage').classList.remove('hidden');
  if(document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(() => {});
  }
  acquireWakeLock();
  clockTimer = setInterval(() => { if(hudVisible()) updateHud(); }, 15000);
  flashEntry(perf.idx);
  renderStage();
  showHud();
}
let stageReturn = 'home'; // where exiting the stage lands: 'home' or 'builder'
function exitPerform(){
  perf.active = false;
  releaseWakeLock();
  clearInterval(clockTimer);
  closeDrawer();
  if(document.fullscreenElement) document.exitFullscreen().catch(() => {});
  el('stage').classList.add('hidden');
  el(stageReturn === 'builder' ? 'builder' : 'home').classList.remove('hidden');
  stageReturn = 'home';
}

/* ---------------------------------------------------------------------------
   Input: tap zones, keys (Bluetooth page-turn pedals present as keyboards
   sending PageDown/PageUp or arrows — handled here, no pairing UI needed).
--------------------------------------------------------------------------- */
el('stage').addEventListener('click', (ev) => {
  if(ev.target.closest('#hudTop') || ev.target.closest('#hudBottom') || ev.target.closest('#setDrawer')) return;
  if(drawerOpen()){ closeDrawer(); return; }
  const x = ev.clientX / window.innerWidth;
  if(x >= 0.6) goNext();
  else if(x <= 0.22) goPrev();
  else (hudVisible() ? hideHud() : showHud());
});
document.addEventListener('keydown', (ev) => {
  if(!perf.active) return;
  if(ev.target && /^(input|select|textarea)$/i.test(ev.target.tagName)) return;
  switch(ev.key){
    case 'PageDown': case 'ArrowRight': case 'ArrowDown': case ' ': ev.preventDefault(); goNext(); break;
    case 'PageUp': case 'ArrowLeft': case 'ArrowUp': ev.preventDefault(); goPrev(); break;
    case 'Escape': ev.preventDefault(); if(drawerOpen()) closeDrawer(); else exitPerform(); break;
    case 'Home': ev.preventDefault(); jumpTo(0); break;
  }
});

/* ---- HUD wiring ---- */
el('hudExit').onclick = exitPerform;
el('hudPos').onclick = () => drawerOpen() ? closeDrawer() : openDrawer();
el('setDrawerClose').onclick = closeDrawer;
async function nudgeScale(delta){
  const entry = perf.entries[perf.idx];
  const pct = Math.max(SCALE_MIN, Math.min(SCALE_MAX, entryScale(entry) + delta));
  await setEntryScale(entry, pct);
  delete perf.cache[perf.idx];
  renderStage(); showHud();
}
el('fontMinus').onclick = () => nudgeScale(-SCALE_STEP);
el('fontPlus').onclick = () => nudgeScale(SCALE_STEP);
el('fontFit').onclick = async () => {
  const entry = perf.entries[perf.idx];
  let pct = entryScale(entry);
  if(entryPages(perf.idx).pages.length <= 1){ toast('Already fits on one screen'); return; }
  while(pct > SCALE_MIN){
    pct -= SCALE_STEP;
    const song = performRenderSong(entryStoredSong(entry), entry.key, entry.capo);
    if(buildStagePages(song, pct).length <= 1) break;
  }
  await setEntryScale(entry, pct);
  delete perf.cache[perf.idx];
  perf.page = 0;
  renderStage(); showHud();
};
el('hudKey').innerHTML = KEY_OPTIONS.map(k => `<option value="${k}">${k}</option>`).join('');
el('hudCapo').innerHTML = ['<option value="">—</option>'].concat(
  Array.from({length: 11}, (_, i) => `<option value="${i + 1}">${i + 1}</option>`)).join('');
el('hudKey').onchange = (ev) => {
  perf.entries[perf.idx].key = ev.target.value;
  delete perf.cache[perf.idx]; perf.page = 0;
  renderStage(); showHud(0);
};
el('hudCapo').onchange = (ev) => {
  perf.entries[perf.idx].capo = ev.target.value;
  delete perf.cache[perf.idx]; perf.page = 0;
  renderStage(); showHud(0);
};

/* ---- re-paginate on resize / rotation ---- */
let resizeTimer = null;
window.addEventListener('resize', () => {
  if(!perf.active) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { perf.cache = {}; renderStage(); }, 250);
});

/* ---------------------------------------------------------------------------
   Set List Builder — ChartBench's builder semantics kept intact: entries
   are {uid, key:'NN', capo:''} on add, duplicates deliberately legal (a
   reprise, a later key), per-entry key/capo/arrangement, saving under an
   existing name updates that set after a confirm, and the working draft
   survives closing the builder (or the whole app) via localStorage —
   the same scratch-space behavior as ChartBench's wcb_setlist_v1.
   Attached-PDF entries from imported sets are preserved (reorder/remove
   only) so editing here never silently destroys them.
--------------------------------------------------------------------------- */
const SLB_DRAFT_KEY = 'cbp_slb_draft_v1';
const bld = { editingId: null, entries: [] };

function defaultSetName(){
  return new Date().toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric', year:'numeric'});
}
function bldSaveDraft(){
  try{ localStorage.setItem(SLB_DRAFT_KEY, JSON.stringify({editingId: bld.editingId, name: el('bldName').value, entries: bld.entries})); }catch(e){}
}
function bldClearDraft(){ try{ localStorage.removeItem(SLB_DRAFT_KEY); }catch(e){} }

function openBuilder(set){
  if(set){
    bld.editingId = set.id;
    bld.entries = (set.entries || []).map(e => Object.assign({}, e));
    el('bldName').value = set.name || '';
    bldSaveDraft();
  } else {
    let draft = null;
    try{ draft = JSON.parse(localStorage.getItem(SLB_DRAFT_KEY)); }catch(e){}
    if(draft && Array.isArray(draft.entries) && draft.entries.length){
      bld.editingId = draft.editingId || null;
      bld.entries = draft.entries;
      el('bldName').value = draft.name || '';
      toast('Restored your set in progress');
    } else {
      bld.editingId = null; bld.entries = [];
      el('bldName').value = '';
    }
  }
  el('bldSearch').value = '';
  el('home').classList.add('hidden');
  el('builder').classList.remove('hidden');
  renderBuilderLib(); renderBuilderSet();
}
function closeBuilder(){
  bldSaveDraft();
  el('builder').classList.add('hidden');
  el('home').classList.remove('hidden');
  renderHome();
}

function renderBuilderLib(){
  const q = el('bldSearch').value.trim().toLowerCase();
  const host = el('bldLibList');
  const shown = songs
    .filter(s => !q || (s.title || '').toLowerCase().includes(q) || (s.artist || '').toLowerCase().includes(q))
    .sort((a, b) => (a.title || '').localeCompare(b.title || ''));
  host.innerHTML = '';
  if(!songs.length){
    host.innerHTML = '<div class="empty-note">No songs in the library yet — import your ChartBench library backup first.</div>';
    return;
  }
  shown.forEach(s => {
    const row = document.createElement('div'); row.className = 'bld-lib-row';
    row.innerHTML = `<div class="grow" style="min-width:0;"><div class="t"></div><div class="sub"></div></div>
      <span class="key-badge"></span><button class="add">+</button>`;
    row.querySelector('.t').textContent = s.title || 'Untitled';
    row.querySelector('.sub').textContent = s.artist || '';
    row.querySelector('.key-badge').textContent = s.key || 'NN';
    row.onclick = () => {
      bld.entries.push({ uid: s.uid, key: 'NN', capo: '' });
      bldSaveDraft(); renderBuilderSet();
    };
    host.appendChild(row);
  });
  if(!shown.length) host.innerHTML = '<div class="empty-note">No songs match.</div>';
}

let bldDragIndex = null;
function bldMove(i, j){
  if(j < 0 || j >= bld.entries.length) return;
  const [e] = bld.entries.splice(i, 1);
  bld.entries.splice(j, 0, e);
  bldSaveDraft(); renderBuilderSet();
}
function renderBuilderSet(){
  const host = el('bldSetList');
  el('bldCount').textContent = bld.entries.length + (bld.entries.length === 1 ? ' song' : ' songs');
  host.innerHTML = '';
  if(!bld.entries.length){
    host.innerHTML = '<div class="empty-note">Empty set — tap songs on the left to add them. The same song can appear twice (a reprise, a different key later on), each with its own key and capo.</div>';
    return;
  }
  bld.entries.forEach((entry, i) => {
    const row = document.createElement('div');
    if(entry.type === 'pdf'){
      row.className = 'bld-row pdf-row';
      row.innerHTML = `<span class="n">${i + 1}</span>
        <div class="grow"><div class="t"></div><div class="sub">PDF attachment · ${entry.pageCount || '?'} page${entry.pageCount === 1 ? '' : 's'} — performs in ChartBench only for now</div></div>
        <button class="up" title="Move up">↑</button><button class="down" title="Move down">↓</button><button class="del" title="Remove">✕</button>`;
      row.querySelector('.t').textContent = '📄 ' + (entry.name || 'PDF');
    } else {
      const s = songs.find(x => x.uid === entry.uid);
      row.className = 'bld-row';
      const arrs = s ? arrangementsOf(s) : [];
      row.innerHTML = `<span class="n">${i + 1}</span>
        <div class="grow"><div class="t"></div><div class="sub"></div></div>
        <select class="e-key" title="Key this entry displays in">${KEY_OPTIONS.map(k => `<option value="${k}"${(entry.key || 'NN') === k ? ' selected' : ''}>${k}</option>`).join('')}</select>
        <select class="e-capo" title="Capo for this entry"><option value="">Capo —</option>${Array.from({length: 11}, (_, c) => `<option value="${c + 1}"${String(entry.capo) === String(c + 1) ? ' selected' : ''}>Capo ${c + 1}</option>`).join('')}</select>
        ${arrs.length > 1 ? `<select class="e-arr" title="Arrangement">${arrs.map(a => `<option value="${a.id}"${(entry.arrangementId || activeArrangementId(s)) === a.id ? ' selected' : ''}>${Renderer.escapeHtml(a.name || 'Main')}</option>`).join('')}</select>` : ''}
        <button class="up" title="Move up">↑</button><button class="down" title="Move down">↓</button><button class="del" title="Remove">✕</button>`;
      row.querySelector('.t').textContent = s ? (s.title || 'Untitled') : '(missing song)';
      row.querySelector('.sub').textContent = s ? (s.artist || '') : 'Not in the library — import it, or remove this entry';
      row.querySelector('.e-key').onchange = e => { entry.key = e.target.value; bldSaveDraft(); };
      row.querySelector('.e-capo').onchange = e => { entry.capo = e.target.value; bldSaveDraft(); };
      const arrSel = row.querySelector('.e-arr');
      if(arrSel) arrSel.onchange = e => { entry.arrangementId = e.target.value; bldSaveDraft(); };
    }
    row.querySelector('.up').onclick = () => bldMove(i, i - 1);
    row.querySelector('.down').onclick = () => bldMove(i, i + 1);
    row.querySelector('.del').onclick = () => { bld.entries.splice(i, 1); bldSaveDraft(); renderBuilderSet(); };
    // Desktop drag reorder (touch reorders with the ↑/↓ buttons).
    row.draggable = true;
    row.addEventListener('dragstart', () => { bldDragIndex = i; });
    row.addEventListener('dragover', ev => { ev.preventDefault(); row.classList.add('drag-over'); });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', ev => {
      ev.preventDefault(); row.classList.remove('drag-over');
      if(bldDragIndex !== null && bldDragIndex !== i) bldMove(bldDragIndex, i);
      bldDragIndex = null;
    });
    host.appendChild(row);
  });
}

async function bldSaveSet(){
  if(!bld.entries.length){ toast('The set is empty — add songs first'); return; }
  let name = el('bldName').value.trim();
  if(!name){ name = defaultSetName(); el('bldName').value = name; }
  const entries = bld.entries.map(e => Object.assign({}, e));
  let target = bld.editingId ? sets.find(s => s.id === bld.editingId) : null;
  if(!target){
    const clash = sets.find(s => s.name.trim().toLowerCase() === name.toLowerCase());
    if(clash){
      if(!confirm(`A saved set named "${clash.name}" already exists. Update it with this set?`)) return;
      target = clash;
    }
  }
  if(target){ target.name = name; target.entries = entries; bld.editingId = target.id; }
  else { const ns = { id: genUid(), name, entries }; sets.push(ns); bld.editingId = ns.id; }
  await saveSets();
  bldClearDraft(); bldSaveDraft(); // draft now mirrors the saved set (editingId set), so Back is safe
  toast(`Saved "${name}"`);
}

el('btnNewSet').onclick = () => openBuilder(null);
el('bldBack').onclick = closeBuilder;
el('bldSearch').oninput = renderBuilderLib;
el('bldName').oninput = bldSaveDraft;
el('bldSave').onclick = bldSaveSet;
el('bldPerform').onclick = () => {
  bldSaveDraft();
  const name = el('bldName').value.trim() || defaultSetName();
  stageReturn = 'builder';
  el('builder').classList.add('hidden');
  performSet({ id: bld.editingId || 'builder-draft', name, entries: bld.entries });
  // performSet may refuse (nothing performable) — put the builder back up.
  if(!perf.active){ stageReturn = 'home'; el('builder').classList.remove('hidden'); }
};

/* ---------------- Home wiring + boot ---------------- */
el('btnImport').onclick = () => el('fileInput').click();
el('fileInput').onchange = async (ev) => {
  if(ev.target.files.length) await handleImportFiles(ev.target.files);
  ev.target.value = '';
};
el('btnPull').onclick = () => pullFromChartBench().catch(err => {
  console.error(err); toast('Pull failed: ' + err.message);
});
el('songSearch').oninput = renderSongList;

(async function boot(){
  el('buildBadge').textContent = 'v' + APP_VERSION + ' · build ' + APP_BUILD;
  await loadData();
  await seedDemoIfEmpty();
  renderHome();
  if(await chartBenchDbExists()) el('btnPull').classList.remove('hidden');
})();
</script>
